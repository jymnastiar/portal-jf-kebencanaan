<script>
  // =========================================================
  // 1. VARIABEL GLOBAL & MESIN STANDARISASI DATA
  // =========================================================
  window.Apex = { chart: { fontFamily: 'Poppins, sans-serif' }, tooltip: { theme: 'dark' } };
  $.fn.dataTable.ext.errMode = 'none';

  var dataCache = { PNS: [], CPNS: [], PPPK: [] };
  var clean = (s) => String(s||"").toUpperCase().trim().replace(/\s+/g, ' ');
  
  var table; 
  var globalMaps = { pangkat: {}, pppk: {}, jabatan: {}, jfk: {}, unitHierarchy: {}, gender: {} };
  var dashboardStats = {}; 

  // MESIN PINTAR: Semua data disaring dan distandarisasi di sini
  function standarisasiPegawai(r, statusDefault) {
    if (!r) return null;

    let nama = String(r.nama || r.NAMA || "").trim();
    let nipClean = String(r.nip || r.NIP || "").replace(/[^0-9]/g, '');
    let rawJk = clean(r.jenis_kelamin || r.JENIS_KELAMIN || r.gender || "");
    let rawJab = clean(r.jabatan || r.JABATAN || "");
    let rawWil = clean(r.jenis_jabatan || r.wilayahKerja || "").replace(/^(PROVINSI|BPBD|BPBA)\s+/i, '').trim();

    if (!nama || nama.toLowerCase() === "nan") return null;

    let gender = "-";
    if (rawJk.startsWith('L') || rawJk === 'PRIA' || rawJk === 'LAKI-LAKI') gender = "Laki-laki";
    else if (rawJk.startsWith('P') || rawJk === 'WANITA' || rawJk === 'PEREMPUAN') gender = "Perempuan";

    let jenjang = "Lainnya";
    if (rawJab.includes("UTAMA")) jenjang = "Ahli Utama";
    else if (rawJab.includes("MADYA")) jenjang = "Ahli Madya";
    else if (rawJab.includes("MUDA")) jenjang = "Ahli Muda";
    else if (rawJab.includes("PERTAMA")) jenjang = "Ahli Pertama";
    else if (rawJab.includes("PENYELIA")) jenjang = "Penyelia";
    else if (rawJab.includes("MAHIR")) jenjang = "Mahir";
    else if (rawJab.includes("TERAMPIL")) jenjang = "Terampil";

    let wilayah = rawWil;
    if (!wilayah || wilayah === "-" || wilayah.includes("TERDEFINISI")) wilayah = "PUSAT";

    return {
      ...r,
      nama: nama || "-",
      _gender: gender,
      _jenjang: jenjang,
      _wilayah: wilayah,
      _status: r.status_pegawai || statusDefault,
      _pangkat: String(r.pangkat || "-").trim()
    };
  }

  // =========================================================
  // 2. FUNGSI INISIALISASI AWAL 
  // =========================================================
  function updateProgress(val, text, iconClass) {
    $('.progress-bar-load').css('width', val + '%'); 
    $('#percentage-text').text(val + '%'); 
    $('#status-text').text(text);
    if(iconClass) $('#loading-icon-container').html(`<i class="${iconClass} fade-icon"></i>`);
  }
  
  var mySessionKey = 'USR_' + Math.floor(Math.random() * 10000) + '_' + new Date().getTime();
  function sendPing() { 
      google.script.run.withSuccessHandler(function(count) { 
          if(count) $('#live-user-count').text(count); 
      }).userHeartbeat(mySessionKey); 
  }

  // =========================================================
  // STATE & LOGIKA OTORISASI ADMIN
  // =========================================================
  window.isAdmin = sessionStorage.getItem('JF_PORTAL_ADMIN') === 'true';
  window.currentTabType = 'PNS';
  window.pendingStatusUpdate = null;

  function renderAdminState() {
    if (window.isAdmin) {
      $('#btn-admin-login').addClass('d-none');
      $('#admin-badge-active').removeClass('d-none');
    } else {
      $('#btn-admin-login').removeClass('d-none');
      $('#admin-badge-active').addClass('d-none');
    }
  }

  function openAdminModal() {
    $('#adminLoginError').addClass('d-none');
    $('#inputAdminPassword').val('');
    $('#inputAdminPassword').attr('type', 'password');
    $('#togglePasswordIcon').removeClass('fa-eye-slash').addClass('fa-eye');
    const modalEl = document.getElementById('adminLoginModal');
    if (modalEl) {
      const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
      modal.show();
      setTimeout(() => $('#inputAdminPassword').focus(), 400);
    }
  }

  function togglePasswordVisibility() {
    const input = document.getElementById('inputAdminPassword');
    const icon = document.getElementById('togglePasswordIcon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.classList.remove('fa-eye');
      icon.classList.add('fa-eye-slash');
    } else {
      input.type = 'password';
      icon.classList.remove('fa-eye-slash');
      icon.classList.add('fa-eye');
    }
  }

  function handleAdminLogin(e) {
    e.preventDefault();
    const pw = $('#inputAdminPassword').val();
    const btn = $('#btnSubmitAdminLogin');
    btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin me-2"></i>Memverifikasi...');
    $('#adminLoginError').addClass('d-none');

    google.script.run
      .withSuccessHandler(function(res) {
        btn.prop('disabled', false).html('<i class="fas fa-key me-2"></i>Masuk Mode Admin');
        if (res && res.valid) {
          window.isAdmin = true;
          sessionStorage.setItem('JF_PORTAL_ADMIN', 'true');
          renderAdminState();
          const modalEl = document.getElementById('adminLoginModal');
          if (modalEl) {
            const modal = bootstrap.Modal.getInstance(modalEl);
            if (modal) modal.hide();
          }
          loadData(window.currentTabType || 'PNS');
          showToastAlert('Mode Admin Aktif! Anda kini dapat mengelola status pegawai.', 'success');
        } else {
          $('#adminLoginError').removeClass('d-none');
        }
      })
      .withFailureHandler(function(err) {
        btn.prop('disabled', false).html('<i class="fas fa-key me-2"></i>Masuk Mode Admin');
        $('#adminLoginError').text('Terjadi kendala saat verifikasi: ' + err.message).removeClass('d-none');
      })
      .verifyAdminPassword(pw);
  }

  function adminLogout() {
    window.isAdmin = false;
    sessionStorage.removeItem('JF_PORTAL_ADMIN');
    renderAdminState();
    loadData(window.currentTabType || 'PNS');
    showToastAlert('Anda telah keluar dari Mode Admin.', 'info');
  }

  function konfirmasiUbahStatus(nip, nama, statusBaru, type) {
    window.pendingStatusUpdate = { nip, nama, statusBaru, type };
    $('#confirmPegawaiNama').text(nama || "-");
    $('#confirmPegawaiNip').text(nip || "-");
    
    let badgeClass = 'bg-primary text-white';
    let badgeStyle = 'background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%) !important; color: #ffffff !important; box-shadow: 0 2px 6px rgba(59, 130, 246, 0.3);';

    if (statusBaru === 'Pemberhentian Sementara') {
      badgeClass = 'bg-warning text-dark';
      badgeStyle = 'background: #fef3c7 !important; color: #92400e !important; border: 1px solid #fde68a !important; box-shadow: 0 2px 6px rgba(217, 119, 6, 0.15);';
    } else if (statusBaru === 'Pemberhentian Tetap') {
      badgeClass = 'bg-danger text-white';
      badgeStyle = 'background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%) !important; color: #ffffff !important; box-shadow: 0 2px 6px rgba(239, 68, 68, 0.3);';
    } else if (statusBaru === 'Pensiun') {
      badgeClass = 'bg-info text-white';
      badgeStyle = 'background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%) !important; color: #ffffff !important; box-shadow: 0 2px 6px rgba(14, 165, 233, 0.3);';
    } else if (statusBaru === 'Meninggal Dunia') {
      badgeClass = 'bg-dark text-white';
      badgeStyle = 'background: #0f172a !important; color: #ffffff !important; box-shadow: 0 2px 6px rgba(15, 23, 42, 0.4); border: 1px solid #334155 !important;';
    }
    
    $('#confirmPegawaiStatusBaru')
      .attr('class', 'badge px-3 py-2 rounded-pill fw-bold ' + badgeClass)
      .attr('style', badgeStyle)
      .text(statusBaru);
    $('#statusUpdateAlert').addClass('d-none').empty();
    $('#btnExecuteStatusChange').prop('disabled', false).html('<i class="fas fa-check-circle me-1"></i>Ya, Simpan Perubahan');

    const modalEl = document.getElementById('statusConfirmModal');
    if (modalEl) {
      const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
      modal.show();
    }
  }

  function eksekusiUbahStatus() {
    if (!window.pendingStatusUpdate) return;
    const { nip, nama, statusBaru } = window.pendingStatusUpdate;
    const btn = $('#btnExecuteStatusChange');
    btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin me-1"></i>Menyimpan...');

    // Simulasi respons cepat tanpa menulis/mengubah ke spreadsheet atau mengubah tabel
    setTimeout(function() {
      btn.prop('disabled', false).html('<i class="fas fa-check-circle me-1"></i>Ya, Simpan Perubahan');
      const modalEl = document.getElementById('statusConfirmModal');
      if (modalEl) {
        const modal = bootstrap.Modal.getInstance(modalEl);
        if (modal) modal.hide();
      }
      showToastAlert(`Aksi perubahan status untuk <strong>${nama || nip}</strong> berhasil diproses.`, 'success');
    }, 400);
  }

  function showToastAlert(pesan, jenis) {
    var notifDiv = document.getElementById('custom-floating-toast');
    if (!notifDiv) {
      notifDiv = document.createElement('div');
      notifDiv.id = 'custom-floating-toast';
      notifDiv.style.cssText = 'position:fixed; top:20px; right:20px; z-index:99999; max-width:380px; transition:all 0.4s ease;';
      document.body.appendChild(notifDiv);
    }
    var bgClass = (jenis === 'success') ? 'bg-success text-white' : ((jenis === 'danger') ? 'bg-danger text-white' : 'bg-primary text-white');
    var icon = (jenis === 'success') ? 'fa-check-circle' : ((jenis === 'danger') ? 'fa-exclamation-circle' : 'fa-info-circle');
    notifDiv.innerHTML = `
      <div class="toast show align-items-center ${bgClass} border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true" style="border-radius:12px;">
        <div class="d-flex p-3 align-items-center">
          <i class="fas ${icon} fa-lg me-3"></i>
          <div class="toast-body p-0" style="font-size:0.85rem;">
            ${pesan}
          </div>
          <button type="button" class="btn-close btn-close-white ms-auto me-1" onclick="this.closest('#custom-floating-toast').innerHTML=''" aria-label="Close"></button>
        </div>
      </div>`;
    setTimeout(() => { if (notifDiv) notifDiv.innerHTML = ''; }, 4500);
  }

$(document).ready(function() {
    renderAdminState();
    initLoadSequence();
    sendPing(); setInterval(sendPing, 60000);
    applySeasonalTheme();

    if ($(window).width() > 768) {
        $('#sidebar').addClass('active'); 
        $('#sidebarHandle i').removeClass('fa-chevron-left').addClass('fa-chevron-right');
    }

    $('#sidebarHandle').off('click').on('click', function() { 
        $('#sidebar').toggleClass('active'); 
        $('#sidebarHandle i').toggleClass('fa-chevron-left fa-chevron-right'); 
    });

    // 3. KODE TOMBOL GARIS TIGA (Khusus HP)
    $('#mobile-toggle').off('click').on('click', function(e) { 
        e.stopPropagation();
        $('#sidebar').toggleClass('active'); 
    });
    
    // Menutup sidebar jika mengeklik layar luar (area gelap)
    $(document).on('click', function(e) {
        if ($(window).width() <= 768 && $('#sidebar').hasClass('active') && !$(e.target).closest('#sidebar').length) {
            $('#sidebar').removeClass('active');
        }
    });
    
    $('.filter-input').on('keyup input change', function() {
        if(!table) return;
        var id = $(this).attr('id'); 
        var val = $(this).val(); 
        var colName = id.replace('fil-', ''); 
        if (id === 'fil-pangkat' && val.trim() !== "") {
            var escaped = val.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            table.column('pangkat:name').search("(^|[^I])" + escaped + "($|[^a-zA-Z0-9])", true, false).draw();
        } else if (id === 'fil-unit_kerja' && val.trim() !== "") {
            var escaped = val.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            table.column('unit_kerja:name').search(/[IVXivx]$/.test(val.trim()) ? escaped + "(?![IVXivx])" : escaped, true, false).draw();
        } else { table.column(colName + ':name').search(val).draw(); }
    });

    $(document).on('change input blur', '#select-prov-daerah', function() { if (typeof renderRekapKeterisianDaerah === "function") renderRekapKeterisianDaerah(); });
    $(document).on('change input blur', '#select-prov-unit', function() { if (typeof generateUnitMatrix === "function") generateUnitMatrix(); });
  });

// =========================================================
  // FUNGSI INISIALISASI AWAL (LAYAR LOADING)
  // =========================================================
  async function initLoadSequence() {
    try {
      updateProgress(10, 'Menyiapkan Workspace...', 'fas fa-cog fa-spin'); 
      await new Promise(r => google.script.run.withSuccessHandler(d => { dashboardStats = d; renderStats(d); r(); }).getDashboardData());
      
      updateProgress(35, 'Memuat Data PNS...', 'fas fa-user-tie'); await loadCategory('PNS');
      updateProgress(65, 'Memuat Data PPPK...', 'fas fa-user-check'); await loadCategory('PPPK');
      
      // --- BARU: Tarik dan Hitung Formasi saat Loading Awal ---
      updateProgress(85, 'Menghitung Status Formasi...', 'fas fa-balance-scale'); 
      await loadTargetFormasi(); 
      
      updateProgress(100, 'Data Siap!', 'fas fa-check-circle text-success');
      
      setTimeout(() => { 
          $('#loading').addClass('hide-loading'); 
          setTimeout(() => { $('#loading').hide(); }, 800); 
          
          calculateAllMaps(); 
          
          // ==========================================
          // PANGGIL SEMUA PEMBUAT TABEL REKAP DI SINI:
          // ==========================================
          generateUnitMatrix(); 
          renderFormasiTable();   // <--- Render langsung tanpa loading
          generatePangkatMatrix();
          generatePPPKMatrix();
          generateJabatanMatrix();
          generateJFKMatrix();
          generateGenderMatrix();
          
          loadData('PNS');
          switchMenu('visual'); 
      }, 800);
      
    } catch(e) { 
      $('#status-text').text('Error. Refresh browser.'); 
      console.error(e);
    }
  }

  // FUNGSI BARU: Menyimpan data Formasi ke dalam memori (Cache)
  window.rekapFormasiData = [];
  async function loadTargetFormasi() { 
      return new Promise(resolve => google.script.run
        .withSuccessHandler(d => { 
            window.rekapFormasiData = d || []; 
            resolve(); 
        })
        .withFailureHandler(err => {
            console.error("Gagal memuat Formasi: ", err);
            resolve(); 
        })
        .getRekapKebutuhan()); 
  }

  async function loadCategory(type) { 
      return new Promise(resolve => google.script.run
        .withSuccessHandler(d => { 
            let parsed = d || [];
            let dataBersih = parsed.map(item => standarisasiPegawai(item, type)).filter(Boolean);
            dataCache[type] = dataBersih; 
            resolve(); 
        })
        .withFailureHandler(err => {
            console.error("Gagal memuat " + type + ": ", err);
            $('#status-text').html(`<span class="text-danger">Gagal memuat ${type}: ${err.message}</span>`);
            setTimeout(() => resolve(), 3000); 
        })
        .getFormattedData(type)); 
  }

  function renderStats(d) {
    var card = (n, l, bClass, icon) => `<div class="col-lg-6 col-md-6 col-6"><div class="card-stat ${bClass}"><div class="icon-main"><i class="fas ${icon}"></i></div><div class="stat-content"><h3>${n}</h3><small>${l}</small></div><i class="fas ${icon} icon-watermark"></i></div></div>`;
    $('#stats-area').html(card(d.pns, 'PNS', 'card-soft-blue', 'fa-user-tie') + card(d.pppk, 'PPPK', 'card-soft-green', 'fa-user-check'));
  }

  // =========================================================
  // 3. FUNGSI PEMBUAT TABEL UTAMA (DataTables)
  // =========================================================
  function loadData(type) {
    try {
        var dataSet = dataCache[type] || [];
        if ($.fn.DataTable.isDataTable('#mainTable')) { $('#mainTable').DataTable().destroy(); }
        $('#mainTable').empty(); 
        
        $('#wrapper-nip, #wrapper-pangkat, #wrapper-jenis').toggle(type !== 'PPNPN' && type !== 'PLT');
        var pangkatTitle = (type === 'PPPK') ? "Golongan" : "Pangkat"; $('#fil-pangkat').attr('placeholder', pangkatTitle + '...');
        var nipTitle = (type === 'PPPK') ? "NI PPPK" : ((type === 'CPNS') ? "NIP" : "NIP");
        
        var cols = [
            { title: "NAMA", data: null, defaultContent: "-", name: 'nama', render: (d,t,row) => (row && row.nama) ? row.nama : "-" },
            { 
                title: '<i class="fas fa-venus-mars" style="opacity:0.5;" title="Gender"></i>', data: null, defaultContent: "-", className: "text-center align-middle", width: "40px", orderable: false, 
                render: function(data, typeRender, row) {
                    if(!row) return "-"; let gen = row._gender;
                    if (typeRender === 'display') {
                        if(gen === "Laki-laki") return '<span class="badge rounded-circle shadow-sm" style="background: #eff6ff; color: #3b82f6; padding: 6px 7px; font-size: 0.85rem;" title="Laki-laki"><i class="fas fa-mars"></i></span>';
                        if(gen === "Perempuan") return '<span class="badge rounded-circle shadow-sm" style="background: #fdf2f8; color: #ec4899; padding: 6px 7px; font-size: 0.85rem;" title="Perempuan"><i class="fas fa-venus"></i></span>';
                        return '<span class="text-muted">-</span>';
                    }
                    return gen;
                }
            }
        ];
        
        if(type !== 'PPNPN' && type !== 'PLT') {
            cols.push({ title: nipTitle.toUpperCase(), data: null, defaultContent: "-", name: 'nip', className: 'text-center', visible : false, render: function(d,t,row) { return row.nip; } });
            cols.push({ title: pangkatTitle.toUpperCase(), data: null, defaultContent: "-", name: 'pangkat', className: 'text-center', render: function(d,t,row) { return row._pangkat; } });
            cols.push({ title: "WILAYAH", data: null, defaultContent: "-", name: 'jenis_jabatan', className: 'text-center', render: function(d,t,row) { return row._wilayah; } });
        }
        
        cols.push({ title: "JABATAN", data: null, defaultContent: "-", name: 'jabatan', render: function(d,t,row) { return row.jabatan; } });
        cols.push({ title: "UNIT KERJA", data: null, defaultContent: "-", name: 'unit_kerja', render: (d,t,row) => (row && row.unit_kerja) ? row.unit_kerja : "-" });
        
        window.currentTabType = type;
        cols.push({
            title: "AKSI", data: null, defaultContent: "", className: "text-center align-middle", orderable: false, width: "80px",
            render: function(data, typeRender, row) {
                if (typeRender !== 'display' || !row) return "";
                var rawNip = row.nip ? String(row.nip).replace(/[^a-zA-Z0-9]/g, '') : "";
                var rawNama = (row.nama || "").replace(/'/g, "\\'");
                
                if (!window.isAdmin) {
                    return `<button class="btn btn-warning btn-sm text-white shadow-sm" onclick="bukaModalEdit('${rawNip}')" title="Edit Data Pegawai"><i class="fa-solid fa-pen-to-square"></i></button>`;
                }

                return `
                <div class="dropdown position-static">
                  <button class="btn-action-dots" type="button" data-bs-toggle="dropdown" aria-expanded="false" data-bs-boundary="viewport" title="Pilihan Tindakan Admin">
                    <i class="fas fa-ellipsis-v"></i>
                  </button>
                  <ul class="dropdown-menu dropdown-menu-end action-dropdown-menu" style="z-index: 1055;">
                    <li><div class="action-dropdown-header"><i class="fas fa-user-gear me-1"></i>Aksi Pegawai</div></li>
                    <li><a class="action-dropdown-item item-edit" href="javascript:void(0)" onclick="bukaModalEdit('${rawNip}')"><i class="fas fa-pen-to-square"></i> <span>Edit Data Pegawai</span></a></li>
                    <li><hr class="dropdown-divider my-1" style="border-color: #f1f5f9;"></li>
                    <li><div class="action-dropdown-header"><i class="fas fa-clock-rotate-left me-1"></i>Update Status Pegawai</div></li>
                    <li><a class="action-dropdown-item item-sementara" href="javascript:void(0)" onclick="konfirmasiUbahStatus('${rawNip}', '${rawNama}', 'Pemberhentian Sementara', '${type}')"><i class="fas fa-pause-circle"></i> <span>Pemberhentian Sementara</span></a></li>
                    <li><a class="action-dropdown-item item-tetap" href="javascript:void(0)" onclick="konfirmasiUbahStatus('${rawNip}', '${rawNama}', 'Pemberhentian Tetap', '${type}')"><i class="fas fa-times-circle"></i> <span>Pemberhentian Tetap</span></a></li>
                    <li><a class="action-dropdown-item item-pensiun" href="javascript:void(0)" onclick="konfirmasiUbahStatus('${rawNip}', '${rawNama}', 'Pensiun', '${type}')"><i class="fas fa-user-clock"></i> <span>Pensiun</span></a></li>
                    <li><a class="action-dropdown-item item-meninggal" href="javascript:void(0)" onclick="konfirmasiUbahStatus('${rawNip}', '${rawNama}', 'Meninggal Dunia', '${type}')"><i class="fas fa-dove"></i> <span>Meninggal Dunia</span></a></li>
                  </ul>
                </div>`;
            }
        });

        table = $('#mainTable').DataTable({ 
            data: dataSet, columns: cols, pageLength: 25, lengthChange: true, lengthMenu: [[10, 25, 50, 100, -1], [10, 25, 50, 100, "All"]], order: [], columnDefs: [{ orderable: false, targets: '_all' }], 
            dom: "<'table-scroll-area't><'row dt-footer-row'<'col-md-6 d-flex align-items-center'i><'col-md-6 d-flex justify-content-end align-items-center gap-3'lp>>", 
            language: { paginate: { previous: '<i class="fas fa-chevron-left"></i>', next: '<i class="fas fa-chevron-right"></i>' }, lengthMenu: "Show _MENU_ entries" }
        });
    } catch(e) { console.error("Error DataTable Load:", e); }
  }

  function changeTab(type) { 
      try {
          $('.custom-tabs-container .custom-tab-btn').removeClass('active'); 
          $('#btn-'+type).addClass('active'); 
          loadData(type); 
      } catch(e) { console.error("Error changeTab:", e); }
  }

  // =========================================================
  // 4. FUNGSI NAVIGASI PINDAH HALAMAN (MENU KIRI)
  // =========================================================
  function switchMenu(menu) {
        $('.main-page').hide();
        $('#sidebar ul li a').removeClass('active');
        $('#menu-' + menu).addClass('active');

        if (menu === 'visual') {
            $('#page-visual').show();
        } else if (menu === 'data') {
            $('#page-data').show();
        } else if (menu === 'rekap') {
            $('#page-rekap').show();
        } else if (menu === 'formasi') {
            $('#page-formasi').show();
            loadRekapFormasi(); // Langsung memuat data saat menu diklik
        }

        // Menutup sidebar jika di HP
        if ($(window).width() <= 768) {
            $('#sidebar').removeClass('active');
        }
    }

  // =========================================================
  // 5. FUNGSI HITUNGAN MATEMATIKA UNTUK REKAPITULASI
  // =========================================================
  function normalizeUnitKerja(u) {
      if (!u) return "";
      let res = String(u).toUpperCase().replace(/BAGIAN TATA USAHA, INSPEKTORAT UTAMA/gi, "INSPEKTORAT UTAMA > BAGIAN TATA USAHA").replace(/SEKRETARIAT UTAMA > PUSAT/gi, "PUSAT").replace("PUSAT DATA, INFORMASI, DAN KOMUNIKASI", "PUSAT DATA, INFORMASI DAN KOMUNIKASI");
      if (res.includes("SUBBAGIAN TATA USAHA PUSAT DATA") || res.includes("SUBBAG TATA USAHA PUSAT DATA")) res = "PUSAT DATA, INFORMASI DAN KOMUNIKASI KEBENCANAAN > SUBBAGIAN TATA USAHA";

  function generateUnitMatrix() {
    try {
      var selectedUnitFilter = clean($('#select-prov-unit').val() || "ALL").replace(/^PROVINSI\s+/i, '').trim();
      var unitMap = {}; 
      var sortOrder = [ "INSPEKTORAT UTAMA", "SEKRETARIAT UTAMA", "DEPUTI BIDANG SISTEM DAN STRATEGI", "DEPUTI BIDANG PENCEGAHAN", "DEPUTI BIDANG PENANGANAN DARURAT", "DEPUTI BIDANG REHABILITASI DAN REKONSTRUKSI", "DEPUTI BIDANG LOGISTIK DAN PERALATAN", "PUSAT DATA, INFORMASI DAN KOMUNIKASI KEBENCANAAN", "PUSAT PENDIDIKAN DAN PELATIHAN PENANGGULANGAN BENCANA", "PUSAT PEMBINAAN JABATAN FUNGSIONAL KEBENCANAAN", "BPBD Provinsi Aceh", "BPBD Provinsi Sumatera Utara" ];

      function distribute(list, key) {
        (list || []).forEach(r => {
          if (!r) return;
          var rawWilayah = r._wilayah;
          var rawStr = normalizeUnitKerja(r.unit_kerja || r.kabupaten || ""); 
          var u = rawStr.split(" > "); var p = clean(u[0]);
          if (!p || p.includes("BADAN NASIONAL")) return;

          if (selectedUnitFilter !== "ALL" && selectedUnitFilter !== "") {
            if (selectedUnitFilter === "BNPB") {
              var isPusat = (rawWilayah === "PUSAT") || p.includes("DEPUTI") || p.includes("SEKRETARIAT") || p.includes("INSPEKTORAT") || p.includes("PUSAT");
              if (!isPusat) return;
            } else {
              var isMatch = (rawWilayah === selectedUnitFilter) || (rawWilayah.includes(selectedUnitFilter)) || (selectedUnitFilter.includes(rawWilayah)) || (p.includes(selectedUnitFilter));
              if (!isMatch) return; 
            }
          }
          var type = key; 
          if (key === 'pns' && r._pangkat !== "-" && !r._pangkat.includes("/")) type = 'tni';
          var finalP = p, finalC = null;
          if (!unitMap[finalP]) unitMap[finalP] = { label: u[0].trim(), pns: [], cpns: [], pppk: [], ppnpn: [], tni: [], child: {} };
          if (u.length > 1) {
            finalC = clean(u[1]);
            if (!unitMap[finalP].child[finalC]) {
              let childLabel = u[1].trim();
              if (/(TATA USAHA|SUBBAGIAN|BAGIAN|KELOMPOK KERJA|SEKSI)/i.test(childLabel) && !childLabel.includes("[")) childLabel = `${childLabel} [${unitMap[finalP].label}]`;
              unitMap[finalP].child[finalC] = { label: childLabel, pns: [], cpns: [], pppk: [], ppnpn: [], tni: [] };
            }
            unitMap[finalP].child[finalC][type].push(r);
          } else { unitMap[finalP][type].push(r); }
        });
      }

      distribute(dataCache.PNS, 'pns'); distribute(dataCache.CPNS, 'cpns'); distribute(dataCache.PPPK, 'pppk'); 

      var dtTable = $('#tbl-unit-matrix');
      if ($.fn.DataTable.isDataTable(dtTable)) dtTable.DataTable().clear().destroy();
      var tbody = dtTable.find('tbody').empty();

      var sortedK = Object.keys(unitMap).sort((a, b) => {
        if (a === "BADAN GIZI NASIONAL") return 1; if (b === "BADAN GIZI NASIONAL") return -1;
        var iA = sortOrder.findIndex(item => a.toLowerCase().includes(item.toLowerCase()));
        var iB = sortOrder.findIndex(item => b.toLowerCase().includes(item.toLowerCase()));
        if (iA !== -1 && iB !== -1) return iA - iB;
        return iA !== -1 ? -1 : (iB !== -1 ? 1 : a.localeCompare(b));
      });

      var grand = { pns: 0, pppk: 0, total: 0 };

      sortedK.forEach((pk) => {
        var p = unitMap[pk]; 
        var allPns = [...p.pns, ...p.cpns]; var allPppk = [...p.pppk];
        Object.keys(p.child).forEach(ck => { 
          var c = p.child[ck]; allPns = allPns.concat(c.pns, c.cpns); allPppk = allPppk.concat(c.pppk);
        });

        var pnsCount = allPns.length; var pppkCount = allPppk.length; var subTotalGrup = pnsCount + pppkCount;
        if (subTotalGrup === 0) return;
        var safeKey = String(pk).replace(/'/g, "\\'").replace(/"/g, '&quot;');
        
        var clickPns = pnsCount > 0 ? `<span class="clickable-num num-pns" onclick='showDrillUnitCat("${safeKey}", "pns")'>${pnsCount}</span>` : `<span class="num-zero">0</span>`;
        var clickPppk = pppkCount > 0 ? `<span class="clickable-num num-pppk" onclick='showDrillUnitCat("${safeKey}", "pppk")'>${pppkCount}</span>` : `<span class="num-zero">0</span>`;
        var clickTot = subTotalGrup > 0 ? `<span class="clickable-num num-total" onclick='showDrillUnitCat("${safeKey}", "all")'>${subTotalGrup}</span>` : `<span class="num-zero">0</span>`;

        tbody.append(`<tr><td class="ps-3 fw-bold">${p.label.toUpperCase()}</td><td class="text-center">${clickPns}</td><td class="text-center">${clickPppk}</td><td class="text-center">${clickTot}</td></tr>`);
        grand.pns += pnsCount; grand.pppk += pppkCount; grand.total += subTotalGrup;
      });

      tbody.append(`<tr class="grand-total-row"><td class="ps-3 text-uppercase">TOTAL KESELURUHAN</td><td class="text-center"><span class="clickable-num num-pns" onclick='showDrillUnitCat("ALL_UNIT", "pns")'>${grand.pns}</span></td><td class="text-center"><span class="clickable-num num-pppk" onclick='showDrillUnitCat("ALL_UNIT", "pppk")'>${grand.pppk}</span></td><td class="text-center border-start"><span class="clickable-num num-total" onclick='showDrillUnitCat("ALL_UNIT", "all")'>${grand.total}</span></td></tr>`);
      window.currentUnitMap = unitMap;
      dtTable.DataTable({ paging: false, searching: false, info: false, ordering: false, lengthChange: false });
    } catch (e) { console.error("Error generateUnitMatrix:", e); }
  }

      data.forEach(function(row) {

              if (val < 0) return `<span style="color: #ef4444; font-weight: bold;">-${Math.abs(val)}</span>`;
              if (val > 0) return `<span style="color: #3b82f6; font-weight: bold;">+${val}</span>`;
              return `<span style="color: #10b981; font-weight: bold;">0</span>`;
          };

          const clickAktual = (val, instansi, jenjang) => {
              if (val > 0) {
                  var safeInst = String(instansi).replace(/'/g, "\\'").replace(/"/g, '&quot;');

          var fontW = row.isParent ? 'font-weight: 800; color: #0f172a; font-size: 0.95rem;' : 'font-weight: 600; color: #334155;';

              <td style="${fontW} padding-left: ${row.isSubUnit ? '10px' : '15px'};">${indent}${row.instansi}</td>
              
              <td class="text-center text-muted">${row.b1}</td>

              <td class="text-center">${formatStatus(row.s2)}</td>
              
              <td class="text-center text-muted">${row.b3}</td>
              <td class="text-center">${clickAktual(row.i3, row.instansi, 'Ahli Madya')}</td>

  // Fungsi untuk memunculkan Modal Popup Daftar Nama saat angka Aktual diklik
  window.showDrillFormasi = function(instansiName, jenjang) {
      var list = []; 
      var categories = ['PNS', 'CPNS', 'PPPK'];
      
      // Standarisasi kata kunci pencarian agar sama dengan mesin backend
      var searchStr = instansiName.toUpperCase();
      if (searchStr.includes("PROVINSI") || searchStr.includes("KABUPATEN") || searchStr.includes("KOTA")) {
          if (!searchStr.startsWith("BPBD")) searchStr = "BPBD " + searchStr;
      } else if (searchStr.includes("DEPUTI") || searchStr.includes("PUSAT PEMBINAAN")) {
          if (!searchStr.endsWith("BNPB")) searchStr = searchStr + " BNPB";
      }

      // Memindai seluruh data pegawai
      categories.forEach(cat => {
          (dataCache[cat] || []).forEach(r => {
              if (!r) return;
              var unitKerjaPegawai = r.unit_kerja ? r.unit_kerja.toUpperCase() : "";
              var jabatanPegawai = r.jabatan ? r.jabatan.toUpperCase() : "";
              
              if (unitKerjaPegawai.includes(searchStr)) {
                  if (jenjang === 'ALL') {
                      if (jabatanPegawai.includes("PERTAMA") || jabatanPegawai.includes("MUDA") || jabatanPegawai.includes("MADYA")) list.push(r);
                  } else if (jenjang === 'Ahli Pertama' && jabatanPegawai.includes("PERTAMA")) {
                      list.push(r);
                  } else if (jenjang === 'Ahli Muda' && jabatanPegawai.includes("MUDA")) {
                      list.push(r);
                  } else if (jenjang === 'Ahli Madya' && jabatanPegawai.includes("MADYA")) {
                      list.push(r);
                  }
              }
          });
      });
      
      // Tampilkan ke Popup
      var titleLabel = instansiName + (jenjang !== "ALL" ? " - " + jenjang : " - Keseluruhan JF");
      renderModal(list, 'all', titleLabel);
  };

      var ws = XLSX.utils.table_to_sheet(tableElem);
      var wscols = []; var range = XLSX.utils.decode_range(ws['!ref'] || 'A1');
      for (var C = range.s.c; C <= range.e.c; ++C) { wscols.push({ wch: 20 }); } ws['!cols'] = wscols;
      var wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Rekap Data");
      var finalFileName = (fileName || 'Export_Data') + '_' + new Date().toISOString().slice(0, 10) + '.xlsx';
      XLSX.writeFile(wb, finalFileName);
    } catch (e) { alert("Gagal mengunduh Excel: " + e.message); }
  }

      if(maxVal === 0) maxVal = 1;

      sortedParents.forEach(parentKey => {

          var pObj = unitMap[parentKey]; var chartItems = []; var pTotal = pObj.pns.length + pObj.cpns.length + pObj.pppk.length + pObj.ppnpn.length + pObj.tni.length;
          if (pTotal > 0) { chartItems.push({ name: pObj.label, val: pTotal, isParent: true }); }
          var groupedEs2 = {};

  function executeDownload() {
      var val = $('#downloadScopeVal').val(); var rawData = []; var fileName = "Data_Pegawai"; var dateStr = new Date().toISOString().slice(0,10);
      var formatRow = (r, type, no) => {

      };

      if (val === "ALL") {

          (dataCache.PNS||[]).forEach(r => rawData.push(formatRow(r, 'PNS', counter++)));

              var cellTextLength = cell.v ? String(cell.v).length : 0; if (!wscols[C]) wscols[C] = { wch: 10 }; 
              if (cellTextLength + 2 > wscols[C].wch) { wscols[C].wch = cellTextLength + 2; } if (wscols[C].wch > 60) wscols[C].wch = 60;
